<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f0f7f0;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🏠 House Price Prediction</h1>

        <p class="subtitle">
            Enter house details to predict the estimated price
        </p>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Square Footage</label>
                    <input type="number"
                           name="square_footage"
                           step="any"
                           required>
                </div>

                <div class="form-group">
                    <label>Number of Bedrooms</label>
                    <input type="number"
                           name="num_bedrooms"
                           min="1"
                           required>
                </div>

                <div class="form-group">
                    <label>Number of Bathrooms</label>
                    <input type="number"
                           name="num_bathrooms"
                           min="1"
                           required>
                </div>

                <div class="form-group">
                    <label>Year Built</label>
                    <input type="number"
                           name="year_built"
                           required>
                </div>

                <div class="form-group">
                    <label>Lot Size</label>
                    <input type="number"
                           name="lot_size"
                           step="any"
                           required>
                </div>

                <div class="form-group">
                    <label>Garage Size</label>
                    <input type="number"
                           name="garage_size"
                           min="0"
                           required>
                </div>

                <div class="form-group">
                    <label>Neighborhood Quality (1-10)</label>
                    <input type="number"
                           name="neighborhood_quality"
                           min="1"
                           max="10"
                           required>
                </div>

            </div>

            <button type="submit">
                Predict House Price
            </button>

        </form>

        {% if prediction is not none %}

        <div class="result">

            <h2>Estimated House Price</h2>

            <div class="price">
                ${{ "{:,.2f}".format(prediction) }}
            </div>

        </div>

        {% endif %}

    </div>

</body>
</html>
